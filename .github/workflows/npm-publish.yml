# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Auto-caching runs `npm config get cache` in the repo, which fails npm's devEngines
          # check before the pinned npm version is installed.
          package-manager-cache: false
      - name: Install npm version pinned in package.json#devEngines
        run: |
          NPM_VERSION=$(node -p "require('./package.json').devEngines.packageManager.version")
          cd "$RUNNER_TEMP" && npm install -g "npm@$NPM_VERSION"
      - run: ls
      - run: npm ci --ignore-scripts
      - run: npm run build:packages

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Auto-caching runs `npm config get cache` in the repo, which fails npm's devEngines
          # check before the pinned npm version is installed.
          package-manager-cache: false
      - name: Install npm version pinned in package.json#devEngines
        run: |
          NPM_VERSION=$(node -p "require('./package.json').devEngines.packageManager.version")
          cd "$RUNNER_TEMP" && npm install -g "npm@$NPM_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - run: git reset --hard
      - run: npm run publish:packages

