# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Run npm build & unit test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v5
      # setup-vp installs the npm version pinned in package.json#devEngines;
      # the npm bundled with setup-node does not match it and fails npm's devEngines check.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: |
            args: ['--frozen-lockfile', '--ignore-scripts']
      - run: npm run build:packages
      - run: npm run test:unit
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @deltares/fews-ssd-webcomponent
